name: Pi issue worker (reusable)

on:
  workflow_call:
    inputs:
      model:
        description: OpenAI API model ID available to Pi
        type: string
        default: gpt-6-sol
      auth_mode:
        description: 'api-key (default) or subscription (private repositories only)'
        type: string
        default: api-key
      subscription_model:
        description: OpenAI model ID available through Sign in with ChatGPT
        type: string
        default: gpt-6-sol
    secrets:
      OPENAI_API_KEY:
        required: false
      PI_AUTH_JSON:
        required: false
      PI_AUTH_JSON_UPDATE_TOKEN:
        required: false

jobs:
  acknowledge:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'pi') &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' && github.event.label.name == 'pi'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # An issue's body is not an issue comment. React to the issue itself.
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssue({
              ...context.repo,
              issue_number: context.issue.number,
              content: 'eyes',
            });

  agent:
    needs: acknowledge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # A subscription refresh rotates the refresh token and saves it to
      # PI_AUTH_JSON. Secrets are read when a job starts, so serialize these jobs
      # to make each one start with the latest saved credential.
      group: pi-agent-${{ github.repository }}-${{ inputs.auth_mode == 'subscription' && 'subscription' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.result.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install Pi
        run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@1.1.0
      - name: Prepare prompt
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'pi-prompt.txt'),
            `Work on the following GitHub issue in this repository. If a code change is needed, edit the working tree but do not commit, push, open a PR, or use the GitHub API. End with a concise summary and tests run. If no code change is needed, answer the issue directly.\n\nIssue #${event.issue.number}:\n${event.issue.body || '(No issue body provided. Ask for details; do not change code.)'}\n`);
          NODE
      - name: Prepare subscription credential
        if: inputs.auth_mode == 'subscription'
        shell: bash
        env:
          PI_AUTH_JSON: ${{ secrets.PI_AUTH_JSON }}
          PI_AUTH_JSON_UPDATE_TOKEN: ${{ secrets.PI_AUTH_JSON_UPDATE_TOKEN }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');

          // Mirrors the Sign in with ChatGPT refresh in the pinned Pi version; update both together.
          const TOKEN_URL = 'https://auth.openai.com/api/accounts/oauth/token';
          const RESOURCE = 'https://api.openai.com/v1';
          const DIRECT_TOKEN_SCOPE = 'chatgpt.tokens.use.direct';
          const EXPIRY_MARGIN_MS = 3 * 60 * 1000;
          // Longer than the job's 30-minute timeout plus Pi's 5-minute refresh margin,
          // so Pi never needs to refresh during the run.
          const MIN_VALIDITY_MS = 40 * 60 * 1000;

          const nonEmptyString = value => typeof value === 'string' && value.trim().length > 0;
          const mask = value => {
            if (nonEmptyString(value)) console.log(`::add-mask::${value}`);
          };

          function gh(args, input) {
            try {
              execFileSync('gh', args, {
                input,
                env: { ...process.env, GH_TOKEN: process.env.PI_AUTH_JSON_UPDATE_TOKEN },
                stdio: ['pipe', 'ignore', 'pipe'],
              });
            } catch (error) {
              throw new Error(error.stderr?.toString().trim() || error.message);
            }
          }

          async function refresh(credential) {
            const response = await fetch(TOKEN_URL, {
              method: 'POST',
              headers: { accept: 'application/json', 'content-type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'refresh_token',
                client_id: credential.clientId,
                refresh_token: credential.refresh,
                resource: RESOURCE,
              }),
            });
            const text = await response.text();
            let token;
            try {
              token = JSON.parse(text);
            } catch {}
            mask(token?.access_token);
            mask(token?.refresh_token);
            mask(token?.id_token);
            if (!response.ok) {
              throw new Error(`OpenAI rejected the refresh token in PI_AUTH_JSON (${response.status}): ${text || response.statusText}. ` +
                'Each refresh token works once, so another Pi install sharing this sign-in or an earlier refresh that was not saved has used it, or it expired. ' +
                'Create a dedicated sign-in for this workflow and replace PI_AUTH_JSON.');
            }
            if (!nonEmptyString(token?.access_token) || !nonEmptyString(token.refresh_token) ||
                !nonEmptyString(token.scope) || !Number.isFinite(token.expires_in) || token.expires_in <= 0) {
              throw new Error('OpenAI returned an unexpected token response, so the stored refresh token may be used up. Sign in again and replace PI_AUTH_JSON.');
            }
            const scopes = token.scope.trim().split(/\s+/);
            if (!scopes.includes(DIRECT_TOKEN_SCOPE)) {
              throw new Error(`The refreshed OpenAI credential lacks ${DIRECT_TOKEN_SCOPE}. Sign in again with Sign in with ChatGPT and replace PI_AUTH_JSON.`);
            }
            return {
              type: 'oauth',
              access: token.access_token,
              refresh: token.refresh_token,
              expires: Date.now() + token.expires_in * 1000 - EXPIRY_MARGIN_MS,
              clientId: credential.clientId,
              scopes,
            };
          }

          async function main() {
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
            if (!event.repository?.private) throw new Error('Subscription mode is restricted to private repositories');
            if (!process.env.PI_AUTH_JSON) throw new Error('PI_AUTH_JSON secret is required for subscription mode');
            let auth;
            try {
              auth = JSON.parse(process.env.PI_AUTH_JSON);
            } catch {
              // JSON parser errors can quote credentials from the secret.
              throw new Error('PI_AUTH_JSON must be valid JSON containing the openai OAuth entry from Pi');
            }
            let credential = auth?.openai;
            if (!credential && auth?.['openai-codex']) {
              throw new Error('Legacy openai-codex credentials are not supported here. Use /login openai, choose Sign in with ChatGPT, and replace PI_AUTH_JSON; do not rename the old entry.');
            }
            if (credential?.type !== 'oauth' || !nonEmptyString(credential.access) ||
                !nonEmptyString(credential.refresh) || !Number.isFinite(credential.expires) ||
                !nonEmptyString(credential.clientId) || !Array.isArray(credential.scopes) ||
                !credential.scopes.every(nonEmptyString) ||
                !credential.scopes.includes(DIRECT_TOKEN_SCOPE)) {
              throw new Error('PI_AUTH_JSON must contain an openai OAuth credential with access, refresh, expires, clientId, and scopes granting chatgpt.tokens.use.direct. Use /login openai and choose Sign in with ChatGPT.');
            }
            // GitHub masks the JSON secret, but not necessarily its individual token fields.
            mask(credential.access);
            mask(credential.refresh);

            const updateToken = nonEmptyString(process.env.PI_AUTH_JSON_UPDATE_TOKEN);
            if (credential.expires - Date.now() < MIN_VALIDITY_MS) {
              if (!updateToken) {
                throw new Error('The OpenAI access token in PI_AUTH_JSON needs a refresh, which rotates the refresh token, so PI_AUTH_JSON_UPDATE_TOKEN is required to save the result. PI_AUTH_JSON was not refreshed and is unchanged; set PI_AUTH_JSON_UPDATE_TOKEN and re-run.');
              }
              // A refresh token works once. Confirm the result can be saved before spending it.
              try {
                gh(['api', `repos/${process.env.GITHUB_REPOSITORY}/actions/secrets/public-key`]);
              } catch (error) {
                throw new Error(`PI_AUTH_JSON_UPDATE_TOKEN cannot write this repository's Actions secrets (${error.message}). PI_AUTH_JSON was not refreshed and is unchanged.`);
              }
              credential = await refresh(credential);
              const content = JSON.stringify({ openai: credential });
              for (let attempt = 1; ; attempt++) {
                try {
                  gh(['secret', 'set', 'PI_AUTH_JSON', '--repo', process.env.GITHUB_REPOSITORY], content);
                  break;
                } catch (error) {
                  if (attempt === 3) {
                    throw new Error(`Refreshed the OpenAI credential but could not save it to PI_AUTH_JSON (${error.message}). OpenAI has already rotated the refresh token, so sign in again and replace PI_AUTH_JSON.`);
                  }
                  await new Promise(resolve => setTimeout(resolve, 2000 * attempt));
                }
              }
              console.log('Refreshed the OpenAI OAuth credential and saved it to PI_AUTH_JSON.');
              if (credential.expires - Date.now() < MIN_VALIDITY_MS) {
                console.log('::warning::The refreshed OpenAI access token expires within 40 minutes; Pi cannot refresh it, so a long run can fail.');
              }
            } else if (!updateToken) {
              const expires = new Date(credential.expires).toISOString();
              console.log(`::warning::PI_AUTH_JSON_UPDATE_TOKEN is not set. The OpenAI access token expires at ${expires}; runs after that will fail until it is set.`);
            }

            const dir = path.join(process.env.RUNNER_TEMP, 'pi-agent');
            fs.mkdirSync(dir, { recursive: true, mode: 0o700 });
            fs.chmodSync(dir, 0o700);
            const authPath = path.join(dir, 'auth.json');
            // Pi gets only the access token, which outlasts this job. Withholding the
            // refresh token means Pi never rotates the credential saved in PI_AUTH_JSON.
            fs.writeFileSync(authPath, JSON.stringify({ openai: { ...credential, refresh: '' } }), { mode: 0o600 });
            fs.chmodSync(authPath, 0o600);
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
      - name: Run Pi
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PI_AUTH_MODE: ${{ inputs.auth_mode }}
          PI_MODEL: ${{ inputs.model }}
          PI_SUBSCRIPTION_MODEL: ${{ inputs.subscription_model }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
        run: |
          case "$PI_AUTH_MODE" in
            api-key)
              if [[ -z "$OPENAI_API_KEY" ]]; then
                echo 'OPENAI_API_KEY secret is required for api-key mode' >&2
                exit 1
              fi
              provider=openai
              model="$PI_MODEL"
              ;;
            subscription)
              # Do not expose an API key or allow API billing in subscription mode.
              unset OPENAI_API_KEY
              provider=openai
              model="$PI_SUBSCRIPTION_MODEL"
              ;;
            *) echo 'Invalid auth_mode (expected api-key or subscription)' >&2; exit 1 ;;
          esac
          pi_stderr="$RUNNER_TEMP/pi-stderr.log"
          set +e
          pi --print --provider "$provider" --model "$model" --no-session \
            --no-approve --no-extensions --no-skills --no-prompt-templates \
            < "$RUNNER_TEMP/pi-prompt.txt" > "$RUNNER_TEMP/answer.md" \
            2> >(tee "$pi_stderr" >&2)
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            if grep -q 'OAuth refresh failed' "$pi_stderr"; then
              echo 'The OpenAI access token expired during the run. Pi does not get the refresh token; re-run the job to refresh it first.' >&2
            fi
            exit "$status"
          fi
      - name: Package working-tree changes
        id: result
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'kind=answer' >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary --full-index > "$RUNNER_TEMP/change.patch"
            echo 'kind=patch' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pi-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/answer.md
            ${{ runner.temp }}/change.patch
          if-no-files-found: error
          retention-days: 1

  answer:
    needs: agent
    if: needs.agent.outputs.kind == 'answer'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pi-result-${{ github.run_id }}
          path: ${{ runner.temp }}/pi-result
      - uses: actions/github-script@v7
        env:
          ANSWER_PATH: ${{ runner.temp }}/pi-result/answer.md
        with:
          script: |
            const fs = require('node:fs');
            const answer = fs.readFileSync(process.env.ANSWER_PATH, 'utf8').trim();
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: (answer || 'Pi completed without a written answer.').slice(0, 60000),
            });

  pull_request:
    needs: agent
    if: needs.agent.outputs.kind == 'patch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pi-result-${{ github.run_id }}
          path: ${{ runner.temp }}/pi-result
      - name: Apply Pi's patch
        shell: bash
        run: |
          git apply --check --index "$RUNNER_TEMP/pi-result/change.patch"
          git apply --index "$RUNNER_TEMP/pi-result/change.patch"
      - name: Create or update pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: pi/issue-${{ github.event.issue.number }}
          title: 'Pi: issue #${{ github.event.issue.number }}'
          body: |
            Proposed by Pi for #${{ github.event.issue.number }}.

            Please review the generated changes before merging.
      - name: Link PR on issue
        if: steps.pr.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Pi proposed a change: ${process.env.PR_URL}`,
            });
