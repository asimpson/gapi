name: Pi issue worker (reusable)

on:
  workflow_call:
    inputs:
      model:
        description: OpenAI API model ID available to Pi
        type: string
        default: gpt-6-sol
      auth_mode:
        description: 'api-key (default) or subscription (private repositories only)'
        type: string
        default: api-key
      subscription_model:
        description: OpenAI model ID available through Sign in with ChatGPT
        type: string
        default: gpt-6-sol
    secrets:
      OPENAI_API_KEY:
        required: false
      PI_AUTH_JSON:
        required: false
      PI_AUTH_JSON_UPDATE_TOKEN:
        required: false

jobs:
  acknowledge:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'pi') &&
      (github.event.action == 'opened' ||
       (github.event.action == 'labeled' && github.event.label.name == 'pi'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # An issue's body is not an issue comment. React to the issue itself.
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssue({
              ...context.repo,
              issue_number: context.issue.number,
              content: 'eyes',
            });

  agent:
    needs: acknowledge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # OpenAI OAuth refresh tokens can rotate; do not let two subscription runs
      # race on the same repository secret.
      group: pi-agent-${{ github.repository }}-${{ inputs.auth_mode == 'subscription' && 'subscription' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.result.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install Pi
        run: npm install --global --ignore-scripts @earendil-works/pi-coding-agent@1.1.0
      - name: Prepare prompt
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'pi-prompt.txt'),
            `Work on the following GitHub issue in this repository. If a code change is needed, edit the working tree but do not commit, push, open a PR, or use the GitHub API. End with a concise summary and tests run. If no code change is needed, answer the issue directly.\n\nIssue #${event.issue.number}:\n${event.issue.body || '(No issue body provided. Ask for details; do not change code.)'}\n`);
          NODE
      - name: Restore subscription credential
        if: inputs.auth_mode == 'subscription'
        shell: bash
        env:
          PI_AUTH_JSON: ${{ secrets.PI_AUTH_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          if (!event.repository?.private) throw new Error('Subscription mode is restricted to private repositories');
          if (!process.env.PI_AUTH_JSON) throw new Error('PI_AUTH_JSON secret is required for subscription mode');
          let auth;
          try {
            auth = JSON.parse(process.env.PI_AUTH_JSON);
          } catch {
            // JSON parser errors can quote credentials from the secret.
            throw new Error('PI_AUTH_JSON must be valid JSON containing the openai OAuth entry from Pi');
          }
          const credential = auth?.openai;
          if (!credential && auth?.['openai-codex']) {
            throw new Error('Legacy openai-codex credentials are not supported here. Use /login openai, choose Sign in with ChatGPT, and replace PI_AUTH_JSON; do not rename the old entry.');
          }
          const nonEmptyString = value => typeof value === 'string' && value.trim().length > 0;
          if (credential?.type !== 'oauth' || !nonEmptyString(credential.access) ||
              !nonEmptyString(credential.refresh) || !Number.isFinite(credential.expires) ||
              !nonEmptyString(credential.clientId) || !Array.isArray(credential.scopes) ||
              !credential.scopes.every(nonEmptyString) ||
              !credential.scopes.includes('chatgpt.tokens.use.direct')) {
            throw new Error('PI_AUTH_JSON must contain an openai OAuth credential with access, refresh, expires, clientId, and scopes granting chatgpt.tokens.use.direct. Use /login openai and choose Sign in with ChatGPT.');
          }
          // GitHub masks the JSON secret, but not necessarily its individual token fields.
          console.log(`::add-mask::${credential.access}`);
          console.log(`::add-mask::${credential.refresh}`);
          const dir = path.join(process.env.RUNNER_TEMP, 'pi-agent');
          fs.mkdirSync(dir, { recursive: true, mode: 0o700 });
          fs.chmodSync(dir, 0o700);
          const authPath = path.join(dir, 'auth.json');
          const content = JSON.stringify({ openai: credential });
          // Preserve clientId, scopes, and any future fields needed by Pi's refresh flow.
          fs.writeFileSync(authPath, content, { mode: 0o600 });
          fs.chmodSync(authPath, 0o600);
          // Keep the original value locally so a later step can detect OAuth rotation.
          const initialPath = path.join(dir, 'auth.initial.json');
          fs.writeFileSync(initialPath, content, { mode: 0o600 });
          fs.chmodSync(initialPath, 0o600);
          NODE
      - name: Run Pi
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PI_AUTH_MODE: ${{ inputs.auth_mode }}
          PI_MODEL: ${{ inputs.model }}
          PI_SUBSCRIPTION_MODEL: ${{ inputs.subscription_model }}
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
        run: |
          case "$PI_AUTH_MODE" in
            api-key)
              if [[ -z "$OPENAI_API_KEY" ]]; then
                echo 'OPENAI_API_KEY secret is required for api-key mode' >&2
                exit 1
              fi
              provider=openai
              model="$PI_MODEL"
              ;;
            subscription)
              # Do not expose an API key or allow API billing in subscription mode.
              unset OPENAI_API_KEY
              provider=openai
              model="$PI_SUBSCRIPTION_MODEL"
              ;;
            *) echo 'Invalid auth_mode (expected api-key or subscription)' >&2; exit 1 ;;
          esac
          pi_stderr="$RUNNER_TEMP/pi-stderr.log"
          set +e
          pi --print --provider "$provider" --model "$model" --no-session \
            --no-approve --no-extensions --no-skills --no-prompt-templates \
            < "$RUNNER_TEMP/pi-prompt.txt" > "$RUNNER_TEMP/answer.md" \
            2> >(tee "$pi_stderr" >&2)
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            if grep -q 'OAuth refresh failed' "$pi_stderr" && grep -q 'invalid_grant' "$pi_stderr"; then
              {
                echo 'OpenAI OAuth refresh failed with invalid_grant.'
                echo 'The PI_AUTH_JSON secret contains a stale or rotated refresh token.'
                echo 'Re-run /login openai with Sign in with ChatGPT and replace PI_AUTH_JSON, or pass PI_AUTH_JSON_UPDATE_TOKEN so this workflow can persist refreshed credentials.'
              } >&2
            fi
            exit "$status"
          fi
      - name: Persist refreshed subscription credential
        if: always() && inputs.auth_mode == 'subscription'
        shell: bash
        env:
          PI_AUTH_JSON_UPDATE_TOKEN: ${{ secrets.PI_AUTH_JSON_UPDATE_TOKEN }}
        run: |
          auth_path="$RUNNER_TEMP/pi-agent/auth.json"
          initial_path="$RUNNER_TEMP/pi-agent/auth.initial.json"
          changed_path="$RUNNER_TEMP/pi-auth-changed"
          AUTH_PATH="$auth_path" INITIAL_AUTH_PATH="$initial_path" CHANGED_PATH="$changed_path" node <<'NODE'
          const fs = require('node:fs');

          const authPath = process.env.AUTH_PATH;
          const initialPath = process.env.INITIAL_AUTH_PATH;
          const changedPath = process.env.CHANGED_PATH;
          const nonEmptyString = value => typeof value === 'string' && value.trim().length > 0;
          const writeChanged = changed => fs.writeFileSync(changedPath, changed ? 'true' : 'false');
          const readJson = file => {
            try {
              return JSON.parse(fs.readFileSync(file, 'utf8'));
            } catch (error) {
              console.log(`::warning::Could not inspect ${file} for OAuth rotation: ${error.message}`);
              return undefined;
            }
          };

          if (!fs.existsSync(authPath) || !fs.existsSync(initialPath)) {
            writeChanged(false);
            process.exit(0);
          }

          const current = readJson(authPath)?.openai;
          const initial = readJson(initialPath)?.openai;
          for (const token of [current?.access, current?.refresh]) {
            if (nonEmptyString(token)) console.log(`::add-mask::${token}`);
          }

          if (current?.type !== 'oauth' || !nonEmptyString(current.access) ||
              !nonEmptyString(current.refresh) || !Number.isFinite(current.expires) ||
              !nonEmptyString(current.clientId) || !Array.isArray(current.scopes)) {
            console.log('::warning::Pi auth file no longer contains a valid openai OAuth credential; not updating PI_AUTH_JSON.');
            writeChanged(false);
            process.exit(0);
          }

          // Store only the expected openai credential, even if the auth file gained other entries.
          fs.writeFileSync(authPath, JSON.stringify({ openai: current }), { mode: 0o600 });
          fs.chmodSync(authPath, 0o600);

          const changed = Boolean(initial) &&
            (current.access !== initial.access ||
             current.refresh !== initial.refresh ||
             current.expires !== initial.expires);
          writeChanged(changed);
          NODE

          changed="$(< "$changed_path")"
          if [[ "$changed" != 'true' ]]; then
            exit 0
          fi

          if [[ -z "$PI_AUTH_JSON_UPDATE_TOKEN" ]]; then
            echo '::warning::Pi refreshed OAuth credentials, but PI_AUTH_JSON_UPDATE_TOKEN was not provided. Update the PI_AUTH_JSON secret from a fresh local /login before the next subscription run; otherwise refresh can fail with invalid_grant.'
            exit 0
          fi

          GH_TOKEN="$PI_AUTH_JSON_UPDATE_TOKEN" gh secret set PI_AUTH_JSON \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$auth_path"
      - name: Package working-tree changes
        id: result
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'kind=answer' >> "$GITHUB_OUTPUT"
          else
            git diff --cached --binary --full-index > "$RUNNER_TEMP/change.patch"
            echo 'kind=patch' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pi-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/answer.md
            ${{ runner.temp }}/change.patch
          if-no-files-found: error
          retention-days: 1

  answer:
    needs: agent
    if: needs.agent.outputs.kind == 'answer'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pi-result-${{ github.run_id }}
          path: ${{ runner.temp }}/pi-result
      - uses: actions/github-script@v7
        env:
          ANSWER_PATH: ${{ runner.temp }}/pi-result/answer.md
        with:
          script: |
            const fs = require('node:fs');
            const answer = fs.readFileSync(process.env.ANSWER_PATH, 'utf8').trim();
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: (answer || 'Pi completed without a written answer.').slice(0, 60000),
            });

  pull_request:
    needs: agent
    if: needs.agent.outputs.kind == 'patch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pi-result-${{ github.run_id }}
          path: ${{ runner.temp }}/pi-result
      - name: Apply Pi's patch
        shell: bash
        run: |
          git apply --check --index "$RUNNER_TEMP/pi-result/change.patch"
          git apply --index "$RUNNER_TEMP/pi-result/change.patch"
      - name: Create or update pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: pi/issue-${{ github.event.issue.number }}
          title: 'Pi: issue #${{ github.event.issue.number }}'
          body: |
            Proposed by Pi for #${{ github.event.issue.number }}.

            Please review the generated changes before merging.
      - name: Link PR on issue
        if: steps.pr.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Pi proposed a change: ${process.env.PR_URL}`,
            });
